<!doctype html>
<html lang="pt-BR">
<head>
  <!-- Metadados, ícones e estilos da interface web. -->
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#F0E8F8"><meta name="description" content="Aprenda idiomas um passo por dia com a Voxparli.">
  <link rel="manifest" href="./manifest.webmanifest"><link rel="icon" type="image/svg+xml" href="./icon.svg"><link rel="apple-touch-icon" href="./icon.svg"><link rel="stylesheet" href="styles.css">
  <title>Voxparli — seu curso de idiomas</title>
</head>
<body>
  <!-- Navegação lateral e conteúdo principal do aplicativo. -->
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#home"><span class="brand-mark"><img src="./favicon.svg" alt=""></span><span>Voxparli</span></a>
      <div class="side-label">APRENDER</div>
      <nav><button class="nav-item active" data-view="home"><span>⌂</span> Início</button><button class="nav-item" data-view="courses"><span>▤</span> Meus idiomas</button><button class="nav-item" data-view="review"><span>↻</span> Revisão</button><button class="nav-item" data-view="placement"><span>✦</span> Teste de nível</button></nav>
      <div class="sidebar-bottom"><div class="mini-card"><span class="mini-icon">✿</span><div><b>Um pouco todo dia</b><small>Seu próximo passo está esperando.</small></div></div><button class="profile profile-button" id="profile-button" type="button"><span class="avatar" id="profile-avatar">+</span><span class="profile-copy"><b id="profile-name">Criar perfil</b><small id="profile-subtitle">Salve seu progresso</small></span><span class="dots">···</span></button></div>
    </aside>
    <main class="main-area"><header class="topbar"><button class="mobile-brand" data-view="home"><img src="./icon.svg" alt=""><b>Voxparli</b></button><div class="top-spacer"></div><a class="download-apk" href="https://github.com/andreborges64/Voxparli/releases/download/apk-latest/Voxparli.apk" aria-label="Baixar o aplicativo Voxparli para Android"><span aria-hidden="true">↓</span><span class="download-label">Baixar APK</span></a><div class="streak"><span>♨</span> <b id="streak-count">0</b> dias</div><button class="avatar small profile-trigger" id="mobile-avatar" aria-label="Abrir perfil">+</button></header>
      <section id="content" class="content"></section>
    </main>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <div id="modal-root"></div>
  <!-- Scripts do banco offline, aplicativo e carregamento opcional de IA. -->
  <script type="module" src="app.js"></script>
  <script type="module" src="ai-runtime.js"></script>
</body>
</html>
