# Compila o aplicativo Android e publica o APK para download.
name: Build Kotlin APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**'
      - '!README.md'
permissions:
  contents: write
jobs:
  # Gera o banco offline e compila o aplicativo nativo.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare offline question bank
        run: node scripts/export-native-bank.cjs
      - uses: gradle/actions/setup-gradle@v4
      - name: Build native APK
        run: android-native/gradlew -p android-native :app:packageVoxparliDebugApk
      - uses: actions/upload-artifact@v4
        with:
          name: voxparli-apk
          path: android-native/app/build/outputs/apk/debug/Voxparli.apk
          retention-days: 14
      - name: Publish APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view apk-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload apk-latest android-native/app/build/outputs/apk/debug/Voxparli.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create apk-latest android-native/app/build/outputs/apk/debug/Voxparli.apk \
              --title "Voxparli para Android" \
              --notes "Baixe o APK Android mais recente do Voxparli." \
              --target "$GITHUB_SHA" \
              --prerelease \
              --repo "$GITHUB_REPOSITORY"
          fi
