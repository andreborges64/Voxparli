# Compila o aplicativo Android e publica o APK para download.
name: Build Kotlin APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**'
      - '!README.md'
jobs:
  # Gera o banco offline e compila o aplicativo nativo.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare offline question bank
        run: node scripts/export-native-bank.cjs
      - uses: gradle/actions/setup-gradle@v4
      - name: Build native APK
        run: android-native/gradlew -p android-native :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: voxparli-debug-apk
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
